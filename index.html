<script>window.hxTF = {
  '5m': {ids: ['h_5m_a', 'h_5m_b', 'h_5m_c'], ft: '%d.%m %H:%M', fa: '%H:%M'},
  '15m': {ids: ['h_15m'], ft: '%d.%m %H:%M', fa: '%d.%m %H:%M'},
  '1h': {ids: ['h_1h'], ft: '%d.%m.%y %H:%M', fa: '%d.%m'},
  '4h': {ids: ['h_4h'], ft: '%d.%m.%y %H:%M', fa: '%d.%m'},
  '1d': {ids: ['h_1d'], ft: '%d.%m.%Y', fa: '%d.%m.%y'},
  '1w': {ids: ['h_1w'], ft: '%d.%m.%Y', fa: '%m.%y'},
  '1M': {ids: ['h_1M'], ft: '%m.%Y', fa: '%m.%Y'}
};
window.hxHeat = window.hxHeat || {tf: '4h', min: 0.25};
window.hxUSD = (v) => v >= 1e6 ? '$' + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + ' млн' : v >= 1e3 ? '$' + Math.round(v / 1e3) + ' тыс.' : '$' + Math.round(v);

// Liquidation model: every rise in open interest opens positions split half long / half short
// over leverage tiers; a level is removed when price trades through it and shrinks when OI falls.
window.hxEngine = (rows) => {
  const n = rows.length, T = new Float64Array(n), O = new Float64Array(n), Hh = new Float64Array(n), Lw = new Float64Array(n), C = new Float64Array(n), OI = new Float64Array(n);
  rows.forEach((r, i) => { if (Array.isArray(r)) { T[i] = r[0]; O[i] = r[1]; Hh[i] = r[2]; Lw[i] = r[3]; C[i] = r[4]; OI[i] = r[5] == null ? NaN : r[5]; } else { T[i] = Number(r.t) * 1000; O[i] = Number(r.o); Hh[i] = Number(r.h); Lw[i] = Number(r.l); C[i] = Number(r.c); OI[i] = r.oi === '' ? NaN : Number(r.oi); } });
  let mn = Infinity, mx = 0; for (let i = 0; i < n; i++) { if (Lw[i] < mn) mn = Lw[i]; if (Hh[i] > mx) mx = Hh[i]; }
  const pmin = mn * 0.75, pmax = mx * 1.3, STEP = Math.log(1.0035), NB = Math.ceil(Math.log(pmax / pmin) / STEP);
  const lp0 = Math.log(pmin);
  const binOf = (p) => Math.max(0, Math.min(NB - 1, Math.floor((Math.log(p) - lp0) / STEP)));
  const price = (k) => Math.exp(lp0 + (k + 0.5) * STEP);
  const tiers = [[10, .25], [25, .3], [50, .3], [100, .15]], MM = 0.005, CP = 1024;
  const fresh = () => ({L: new Float64Array(NB), S: new Float64Array(NB), f: 1, prev: NaN, lmax: -1, smin: NB, i: -1});
  const copy = (s) => ({L: s.L.slice(), S: s.S.slice(), f: s.f, prev: s.prev, lmax: s.lmax, smin: s.smin, i: s.i});
  const step = (s, i) => {
    const kl = binOf(Lw[i]);
    for (let k = Math.max(kl, 0); k <= s.lmax; k++) s.L[k] = 0;
    if (s.lmax >= kl) s.lmax = kl - 1;
    const kh = binOf(Hh[i]);
    for (let k = s.smin; k <= kh && k < NB; k++) s.S[k] = 0;
    if (s.smin <= kh) s.smin = kh + 1;
    const oi = OI[i];
    if (!isNaN(oi)) {
      if (!isNaN(s.prev) && s.prev > 0) {
        const d = oi - s.prev;
        if (d > 0) {
          const tp = (O[i] + Hh[i] + Lw[i] + C[i]) / 4, usd = d * tp * 0.5 / s.f;
          for (const [lev, w] of tiers) {
            const kL = binOf(tp * (1 - 1 / lev + MM)), kS = binOf(tp * (1 + 1 / lev - MM));
            if (kL < kl) { s.L[kL] += usd * w; if (kL > s.lmax) s.lmax = kL; }
            if (kS > kh) { s.S[kS] += usd * w; if (kS < s.smin) s.smin = kS; }
          }
        } else if (d < 0) {
          s.f *= 1 + d / s.prev;
          if (s.f < 1e-6) { for (let k = 0; k < NB; k++) { s.L[k] *= s.f; s.S[k] *= s.f; } s.f = 1; }
        }
      }
      s.prev = oi;
    }
    s.i = i;
  };
  const cps = []; const s0 = fresh();
  for (let i = 0; i < n; i++) { step(s0, i); if (i % CP === CP - 1 || i === n - 1) cps.push(copy(s0)); }
  const lastSnap = (() => { const v = new Float32Array(NB * 2); for (let k = 0; k < NB; k++) { v[k] = s0.L[k] * s0.f; v[NB + k] = s0.S[k] * s0.f; } return v; })();
  const cache = new Map();
  // snapshots at sorted bar indices; replays from the nearest checkpoint
  const snaps = (idx) => {
    const out = new Array(idx.length); const miss = [];
    idx.forEach((i, j) => { const c = cache.get(i); if (c) out[j] = c; else miss.push(j); });
    if (miss.length) {
      if (cache.size > 6000) cache.clear();
      let s = null;
      for (const j of miss) {
        const i = idx[j];
        if (!s || s.i > i || Math.floor(i / CP) - Math.floor(Math.max(s.i, 0) / CP) > 1) {
          const ci = Math.floor((i + 1) / CP) - 1;
          s = ci >= 0 ? copy(cps[ci]) : fresh();
        }
        while (s.i < i) step(s, s.i + 1);
        const v = new Float32Array(NB * 2); for (let k = 0; k < NB; k++) { v[k] = s.L[k] * s.f; v[NB + k] = s.S[k] * s.f; }
        cache.set(i, v); out[j] = v;
      }
    }
    return out;
  };
  return {n, T, O, H: Hh, L: Lw, C, NB, price, binOf, STEP, snaps, last: lastSnap};
};

window.hxZones = (eng, snap, minFrac) => {
  const NB = eng.NB; let mx = 0;
  for (let k = 0; k < 2 * NB; k++) if (snap[k] > mx) mx = snap[k];
  const thr = mx * minFrac, zones = [];
  for (const side of [0, 1]) {
    let z = null;
    for (let k = 0; k < NB; k++) {
      const v = snap[side * NB + k];
      if (v >= thr && v > 0) { if (z && z.k1 === k - 1) { z.k1 = k; z.v += v; } else { z = {side, k0: k, k1: k, v}; zones.push(z); } }
    }
  }
  return zones;
};

window.dash={data:()=>({status:'none',data:[]})};
// Chart analysis computed from the candles of the selected timeframe.
window.hxAnalyze = (E) => {
  if (E.an) return E.an;
  const n = E.n, O = E.O, H = E.H, L = E.L, C = E.C;
  const ema = (p) => { const k = 2 / (p + 1), o = new Float64Array(n); o[0] = C[0]; for (let i = 1; i < n; i++) o[i] = C[i] * k + o[i - 1] * (1 - k); return o; };
  const e50 = ema(50), e200 = ema(200);
  const rsi = new Float64Array(n).fill(NaN); {
    let g = 0, l = 0; const P = 14;
    for (let i = 1; i < n; i++) {
      const d = C[i] - C[i - 1];
      if (i <= P) { g += Math.max(d, 0); l += Math.max(-d, 0); if (i === P) { g /= P; l /= P; rsi[i] = 100 - 100 / (1 + g / (l || 1e-9)); } }
      else { g = (g * (P - 1) + Math.max(d, 0)) / P; l = (l * (P - 1) + Math.max(-d, 0)) / P; rsi[i] = 100 - 100 / (1 + g / (l || 1e-9)); }
    }
  }
  const atr = new Float64Array(n); { let a = 0; for (let i = 0; i < n; i++) { const tr = i ? Math.max(H[i] - L[i], Math.abs(H[i] - C[i - 1]), Math.abs(L[i] - C[i - 1])) : H[i] - L[i]; a = i < 14 ? (a * i + tr) / (i + 1) : (a * 13 + tr) / 14; atr[i] = a; } }
  const piv = (W) => {
    const hi = [], lo = [];
    for (let i = W; i < n - W; i++) {
      let h = true, l = true;
      for (let k = 1; k <= W && (h || l); k++) { if (H[i] < H[i - k] || H[i] < H[i + k]) h = false; if (L[i] > L[i - k] || L[i] > L[i + k]) l = false; }
      if (h) hi.push(i); if (l) lo.push(i);
    }
    return {hi, lo};
  };
  // market structure: HH/HL/LH/LL and breaks (BOS continues the trend, CHoCH flips it)
  const P5 = piv(5), labels = [], breaks = [];
  P5.hi.forEach((i, k) => { if (k) labels.push({i, p: H[i], up: true, t: H[i] > H[P5.hi[k - 1]] ? 'HH' : 'LH'}); });
  P5.lo.forEach((i, k) => { if (k) labels.push({i, p: L[i], up: false, t: L[i] > L[P5.lo[k - 1]] ? 'HL' : 'LL'}); });
  {
    let trend = 0, hp = 0, lp = 0; const W = 5;
    for (let i = 0; i < n; i++) {
      while (hp < P5.hi.length && P5.hi[hp] + W <= i) hp++;
      while (lp < P5.lo.length && P5.lo[lp] + W <= i) lp++;
      const sh = hp ? P5.hi[hp - 1] : -1, sl = lp ? P5.lo[lp - 1] : -1;
      if (sh >= 0 && C[i] > H[sh] && C[i - 1] <= H[sh] && !(breaks.length && breaks[breaks.length - 1].from === sh)) { breaks.push({i, from: sh, p: H[sh], up: true, t: trend === -1 ? 'CHoCH' : 'BOS'}); trend = 1; }
      if (sl >= 0 && C[i] < L[sl] && C[i - 1] >= L[sl] && !(breaks.length && breaks[breaks.length - 1].from === sl)) { breaks.push({i, from: sl, p: L[sl], up: false, t: trend === 1 ? 'CHoCH' : 'BOS'}); trend = -1; }
    }
  }
  // RSI divergences between neighbouring 3-bar pivots
  const P3 = piv(3), divs = [];
  for (let k = 1; k < P3.lo.length; k++) {
    const a = P3.lo[k - 1], b = P3.lo[k]; if (b - a < 5 || b - a > 60 || isNaN(rsi[a])) continue;
    if (L[b] < L[a] && rsi[b] > rsi[a] && rsi[a] < 40) divs.push({a, b, pa: L[a], pb: L[b], up: true, hidden: false});
    else if (L[b] > L[a] && rsi[b] < rsi[a]) divs.push({a, b, pa: L[a], pb: L[b], up: true, hidden: true});
  }
  for (let k = 1; k < P3.hi.length; k++) {
    const a = P3.hi[k - 1], b = P3.hi[k]; if (b - a < 5 || b - a > 60 || isNaN(rsi[a])) continue;
    if (H[b] > H[a] && rsi[b] < rsi[a] && rsi[a] > 60) divs.push({a, b, pa: H[a], pb: H[b], up: false, hidden: false});
    else if (H[b] < H[a] && rsi[b] > rsi[a]) divs.push({a, b, pa: H[a], pb: H[b], up: false, hidden: true});
  }
  divs.sort((x, y) => x.b - y.b);
  // fair value gaps, alive until price trades through them
  const fvg = [];
  for (let i = 2; i < n; i++) {
    if (L[i] > H[i - 2] && (L[i] / H[i - 2] - 1) >= 0.003) fvg.push({i, lo: H[i - 2], hi: L[i], up: true, end: n});
    if (H[i] < L[i - 2] && (L[i - 2] / H[i] - 1) >= 0.003) fvg.push({i, lo: H[i], hi: L[i - 2], up: false, end: n});
  }
  fvg.forEach((f) => { for (let j = f.i + 1; j < n; j++) { if (f.up ? L[j] <= f.lo : H[j] >= f.hi) { f.end = j; break; } } });
  // figures: double tops/bottoms confirmed by a close through the neckline, and ranges
  const figs = [];
  const dbl = (arr, top) => {
    for (let k = 1; k < arr.length; k++) {
      const a = arr[k - 1], b = arr[k], pa = top ? H[a] : L[a], pb = top ? H[b] : L[b];
      if (b - a < 8 || Math.abs(pb / pa - 1) > 0.015) continue;
      let m = a, mv = top ? Infinity : -Infinity;
      for (let i = a; i <= b; i++) { if (top ? L[i] < mv : H[i] > mv) { mv = top ? L[i] : H[i]; m = i; } }
      const depth = top ? 1 - mv / Math.min(pa, pb) : mv / Math.max(pa, pb) - 1;
      if (depth < Math.max(0.03, 2 * atr[b] / C[b])) continue;
      for (let j = b + 1; j < Math.min(n, b + 3 * (b - a)); j++) {
        if (top ? C[j] < mv : C[j] > mv) { figs.push({kind: top ? 'Двойная вершина' : 'Двойное дно', a, m, b, j, pa, pb, neck: mv, top}); break; }
        if (top ? H[j] > Math.max(pa, pb) * 1.01 : L[j] < Math.min(pa, pb) * 0.99) break;
      }
    }
  };
  dbl(P5.hi, true); dbl(P5.lo, false);
  const ranges = []; {
    const N = 30; let i = N;
    while (i < n - 1) {
      let hi = -Infinity, lo = Infinity; for (let k = i - N; k < i; k++) { if (H[k] > hi) hi = H[k]; if (L[k] < lo) lo = L[k]; }
      if (hi / lo - 1 <= 0.12 && hi / lo - 1 >= 0.01) {
        let j = i; while (j < n && C[j] <= hi && C[j] >= lo) j++;
        ranges.push({a: i - N, b: Math.min(j, n - 1), lo, hi, up: j < n ? C[j] > hi : null}); i = j + N;
      } else i++;
    }
  }
  E.an = {e50, e200, rsi, atr, labels, breaks, divs, fvg, figs, ranges};
  return E.an;
};

// Similar situations: the closest past windows to the latest price path, and what followed.
window.hxAnalogs = (E, W = 40, F = 20, K = 5) => {
  if (E.ana) return E.ana;
  const n = E.n, C = E.C; if (n < W * 3 + F) return (E.ana = null);
  const lc = new Float64Array(n); for (let i = 0; i < n; i++) lc[i] = Math.log(C[i]);
  const norm = (s) => { let m = 0; for (let k = 0; k < W; k++) m += lc[s + k]; m /= W; let v = 0; for (let k = 0; k < W; k++) v += (lc[s + k] - m) ** 2; return {m, sd: Math.sqrt(v / W) || 1e-9}; };
  const q = n - W, qn = norm(q), qz = new Float64Array(W); for (let k = 0; k < W; k++) qz[k] = (lc[q + k] - qn.m) / qn.sd;
  const cand = [];
  for (let s = 0; s + W + F <= q - W; s++) {
    let sx = 0, sxx = 0, sxy = 0; for (let k = 0; k < W; k++) { const x = lc[s + k]; sx += x; sxx += x * x; sxy += x * qz[k]; }
    const m = sx / W, sd = Math.sqrt(Math.max(sxx / W - m * m, 1e-18)); cand.push({s, r: (sxy / W) / sd});
  }
  cand.sort((a, b) => b.r - a.r);
  const pick = []; for (const c of cand) { if (pick.every((p) => Math.abs(p.s - c.s) >= W)) pick.push(c); if (pick.length === K) break; }
  const paths = pick.map((p) => { const base = C[p.s + W - 1], out = []; for (let f = 1; f <= F; f++) out.push(C[p.s + W - 1 + f] / base - 1); return out; });
  const med = [], lo = [], hi = [];
  for (let f = 0; f < F; f++) { const v = paths.map((x) => x[f]).sort((a, b) => a - b); med.push(v[Math.floor(v.length / 2)]); lo.push(v[0]); hi.push(v[v.length - 1]); }
  E.ana = {W, F, pick, paths, med, lo, hi, up: paths.filter((x) => x[F - 1] > 0).length};
  return E.ana;
};

window.hxTrades = () => {
  const d = dash.data('strat_trades'); if (d.status !== 'ok') return [];
  return d.data.map((r) => ({et: Number(r.entry_t) * 1000, xt: Number(r.exit_t) * 1000, ep: Number(r.entry_p), xp: Number(r.exit_p), ret: Number(r.ret), open: r.status === 'открыта'}));
};
window.hxIdxAt = (E, t) => { let lo = 0, hi = E.n - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (E.T[m] <= t) lo = m; else hi = m - 1; } return lo; };

// Auto trendlines: connect 5-bar pivots of the same type; a line is valid while no candle closes through it.
window.hxTrendlines = (E, A, W = 5) => {
  if (E.tl) return E.tl;
  const n = E.n, H = E.H, L = E.L, C = E.C, atr = A.atr;
  const lh = Array.from(H, Math.log), ll = Array.from(L, Math.log), lc = Array.from(C, Math.log);
  const piv = (hi) => { const o = []; for (let i = W; i < n - W; i++) { let ok = true; for (let k = 1; k <= W && ok; k++) { if (hi ? (H[i] < H[i - k] || H[i] < H[i + k]) : (L[i] > L[i - k] || L[i] > L[i + k])) ok = false; } if (ok) o.push(i); } return o; };
  const lines = [];
  for (const res of [true, false]) {
    const P = piv(res), lv = res ? lh : ll;
    for (let q = 1; q < P.length; q++) {
      const b = P[q]; let best = null;
      for (let p = q - 1; p >= 0 && b - P[p] <= 200; p--) {
        const a = P[p]; if (b - a < 8) continue;
        if (res ? !(H[a] > H[b]) : !(L[a] < L[b])) continue;
        const sl = (lv[b] - lv[a]) / (b - a), at = (i) => lv[a] + sl * (i - a);
        const tol = (i) => 0.25 * atr[i] / C[i];
        let ok = true, touches = 2;
        for (let i = a + 1; i < b && ok; i++) { if (res ? lc[i] > at(i) + tol(i) : lc[i] < at(i) - tol(i)) ok = false; }
        if (!ok) continue;
        for (let r = p + 1; r < q; r++) { const k = P[r]; if (Math.abs(lv[k] - at(k)) <= tol(k)) touches++; }
        if (!best || touches > best.touches || (touches === best.touches && a < best.a)) best = {a, b, sl, base: lv[a], touches};
      }
      if (!best) continue;
      const at = (i) => best.base + best.sl * (i - best.a), tol = (i) => 0.25 * atr[i] / C[i];
      let brk = null; const after = [];
      for (let i = best.b + W + 1; i < n; i++) {
        if (res ? lc[i] > at(i) + tol(i) : lc[i] < at(i) - tol(i)) { brk = i; break; }
        if (res ? lh[i] >= at(i) - tol(i) : ll[i] <= at(i) + tol(i)) after.push(i);
      }
      lines.push({res, a: best.a, b: best.b, base: best.base, sl: best.sl, touches: best.touches, brk, after, conf: best.b + W});
    }
  }
  // drop near-duplicates: keep the line with more touches among lines sharing an anchor
  const keep = [];
  lines.sort((x, y) => y.touches - x.touches || (x.b - x.a) - (y.b - y.a)).forEach((l) => { if (!keep.some((k) => k.res === l.res && (k.a === l.a || k.b === l.b))) keep.push(l); });
  keep.forEach((l) => { l.at = (i) => Math.exp(l.base + l.sl * (i - l.a)); });
  E.tl = keep.sort((x, y) => x.b - y.b);
  return E.tl;
};

'use strict';
// Swing legs with an adaptive threshold, Fibonacci levels of the last leg, and an Elliott impulse count that obeys the three hard rules.
window.hxZigzag = (E, A) => {
  if (E.zz) return E.zz;
  const n = E.n, H = E.H, L = E.L, C = E.C;
  const pct = [...A.atr].slice(-500).map((a, k, arr) => a / C[n - arr.length + k]).sort((x, y) => x - y);
  const th = Math.max(0.03, 3 * pct[pct.length >> 1]);
  const pv = []; let dir = 0, hi = H[0], hiI = 0, lo = L[0], loI = 0, ext = 0, ei = 0;
  for (let i = 1; i < n; i++) {
    if (dir === 0) {
      if (H[i] > hi) { hi = H[i]; hiI = i; } if (L[i] < lo) { lo = L[i]; loI = i; }
      if (L[i] <= hi * (1 - th) && hiI < i) { pv.push({i: hiI, p: hi, hi: true}); dir = -1; ext = L[i]; ei = i; }
      else if (H[i] >= lo * (1 + th) && loI < i) { pv.push({i: loI, p: lo, hi: false}); dir = 1; ext = H[i]; ei = i; }
    } else if (dir === 1) {
      if (H[i] >= ext) { ext = H[i]; ei = i; }
      else if (L[i] <= ext * (1 - th)) { pv.push({i: ei, p: ext, hi: true}); dir = -1; ext = L[i]; ei = i; }
